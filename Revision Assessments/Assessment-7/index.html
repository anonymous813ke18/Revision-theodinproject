<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <div class="library-header">
        <h1>My Library</h1>
        <button class="add-book">Add Book</button>
    </div>
    <dialog class="book-dialog">
        <h1>Add the Book!</h1>
        <button class="close-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-x"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <form action="">
            <div class="form-row">
                <label for="book-title">Title:</label>
                <input type="text" name="book-title" id="book-title" autofocus required placeholder="Enter Title *">
            </div>
            <div class="form-row">
                <label for="book-author">Author:</label>
                <input type="text" name="book-author" id="book-author" required placeholder="Enter Author *">
            </div>
            <div class="form-row">
                <label for="book-pages">Pages:</label>
                <input type="number" name="book-pages" id="book-pages" required placeholder="Enter Pages *">
            </div>
            <div class="form-row">
                <label for="book-status">Status:</label>
                <select name="book-status" id="book-status" required>
                    <option value="read">Read</option>
                    <option value="pending">Pending</option>
                </select>
            </div>
            <span class="error-msg"></span>
            <div class="form-row">
                <button class="add-btn">Submit</button>
            </div>
        </form>
    </dialog>
    
    <div class="book-grid">
        <!-- <div class="book-card">
            <h4>Title:</h4><p>Book Title</p>
            <h4>Author:</h4><p>Book Author</p>
            <h4>Pages:</h4><p>100</p>
            <h4>Status:</h4><p>Read</p>
            <div class="book-card-btn-container">
                <button>Delete</button><button>Mark as Unread</button>
            </div>
        </div> -->
    </div>
</body>
</html>
