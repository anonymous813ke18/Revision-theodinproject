<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="wrapper">
        <!-- Example 1 -->
        <p>Check out this SVG:</p>

        <svg width="100" height="100" class="example1">
            <circle 
                fill="hotpink"
                r="30"
                cx="50"
                cy="50"
            />
        </svg>
    </div>

    <div class="wrapper">
        <!-- Example 2 -->
        <p>Example 2</p>
        <button>
            <svg width="100" height="100" class="example2">
                <circle 
                    r="30px"
                    cx="50px"
                    cy="50px"
                />
            </svg>
        </button>
    </div>

    <div class="wrapper">
        <!-- Lines in SVG -->
        <p>Lines in SVG:</p>
        <svg width="100" height="100">
            <line 
                x1="0"
                y1="0"
                x2="100"
                y2="100"
                stroke="oklch(0.9 0.3 164)"
                stroke-width="5"
            />
        </svg>
    </div>

    <div class="wrapper">
        <p>Rectangle in SVG:</p>
        <svg width="100" height="100">
            <rect 
                x="0"
                y="20"
                width="100"
                height="80"
                stroke="oklch(0.9 0.3 164)"
                stroke-width="5"
                fill="oklch(0.5 0.7 200)"
                rx="10"
                ry="10"
            />
        </svg>
    </div>

    <div class="wrapper">
        <p>Circles in SVG:</p>
        <svg width="100" height="100">
            <circle
              cx="50"
              cy="50"
              r="45"
              fill="none"
              stroke="oklch(0.9 0.3 164)"
              stroke-width="5"
            />
        </svg>
    </div>

    <div class="wrapper">
        <p>Ellipse in SVG:</p>
        <svg width="100" height="100">
            <ellipse 
                cx="50"
                cy="50"
                rx="45"
                ry="30"
                fill="none"
                stroke="oklch(0.9 0.3 164)"
                stroke-width="5"
            />
        </svg>
    </div>

    <div class="wrapper">
        <p>Polygons in SVG:</p>
        <svg width="100" height="100">
            <polygon 
                points="
                    15,15
                    50,5
                    90,15
                    75, 85
                    30,85
                "
                stroke="oklch(0.9 0.3 164)"
                stroke-width="5"
                />
        </svg>
    </div>

    <div class="wrapper">
        <p>Viewbox Attribute in SVG</p>
        <svg width="100" height="100" viewBox="-5 -5 150 150">
            <rect 
                x="0"
                y="0"
                width="140"
                height="140"
                stroke="oklch(0.9 0.3 164)"
                stroke-width="5"
            />
        </svg>
    </div>
</body>
</html>
